name: Release

# Pushing a tag vX.Y.Z builds, signs and publishes a GitHub release in the
# layout the Terraform and OpenTofu registries ingest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The signing key lives in the "release" environment, so only this job can
    # read it, and the environment's protection rules gate every release.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Take the release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v version="$version" '$1 == "##" { found = $2 == version; next } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - run: go test ./...
      - name: Import the signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
